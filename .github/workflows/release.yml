# ─────────────────────────────────────────────────────────────
#  ClassSoftwareHub 跨平台版 —— 发版
#
#  触发：推一个 v* 的 tag（或手动 dispatch 指定已存在的 tag）
#  流程：复用 build.yml 把 5 个平台都构建一遍 → 汇总产物 → 建 GitHub Release
#
#  产物命名是**有讲究**的，应用内更新器（Services/Updating/GitHubReleaseSource.cs）
#  靠这套约定认包：
#    · 安装包后缀要是 .exe / .msi / .zip
#    · 名字里带 setup / installer / -install 的会被优先当成「安装包」
#    · 同名的 .md5 或 checksums*.md5 会被当成校验文件拉下来对 MD5
#  所以 Windows 的包叫 ...-Setup-...exe，校验文件叫 checksums.md5。
# ─────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已经推送到远端，例如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # 复用 build.yml 的矩阵：Windows x64 / macOS arm64+x64 / Linux arm64+x64
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
    secrets: inherit

  publish:
    name: 发布 GitHub Release
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_NAME: ClassSoftwareHub
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: 下载全部平台的产物
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: 生成校验和（md5sum 格式）
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f checksums.md5
          md5sum -b * > checksums.md5
          echo "──── checksums.md5 ────"
          cat checksums.md5

      - name: 写 Release 说明
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## ${{ env.APP_NAME }} ${{ env.TAG }}"
            echo
            echo "WinUI 3 → Avalonia 12 的跨平台移植版，版本 ${{ env.VERSION }}。"
            echo
            echo "### 安装包"
            echo
            for f in dist/*; do
              case "${f}" in
                */checksums.md5) continue ;;
              esac
              printf -- '- `%s`（%s）\n' "$(basename "${f}")" "$(du -h "${f}" | cut -f1)"
            done
            echo
            echo "### 校验"
            echo
            echo '每个包的 MD5 在 [`checksums.md5`](checksums.md5) 里（md5sum 格式），本地可以这样对：'
            echo
            echo '```sh'
            echo 'md5sum -c checksums.md5'
            echo '```'
            echo
            echo "### macOS 第一次打开"
            echo
            echo '这个包没有签名和公证，第一次打开会被 Gatekeeper 拦。两个办法：'
            echo
            echo '1. 右键点应用 →「打开」→ 再点「打开」；'
            echo '2. 或者在终端里先去掉隔离标记：'
            echo
            echo '```sh'
            echo 'xattr -dr com.apple.quarantine ClassSoftwareHub.app'
            echo '```'
            echo
            echo "### Linux"
            echo
            echo '```sh'
            echo 'sudo apt install ./classsoftwarehub_*.deb'
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: 创建 / 更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # tag 里带 insider / beta / rc / alpha 的打成预发布版，
          # 应用内更新器的「Insider」通道只认 GitHub 的 pre-release。
          PRE_FLAG=""
          case "${TAG}" in
            *insider*|*beta*|*rc*|*alpha*|*preview*) PRE_FLAG="--prerelease" ;;
          esac

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，改为覆盖上传资产"
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" \
              --title "${{ env.APP_NAME }} ${TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG}" dist/* \
              --title "${{ env.APP_NAME }} ${TAG}" \
              --notes-file release-notes.md \
              --generate-notes \
              --verify-tag \
              ${PRE_FLAG}
          fi

          echo "──── Release 资产 ────"
          gh release view "${TAG}" --json name,tagName,url,assets \
            --jq '{tag: .tagName, name: .name, url: .url, assets: [.assets[] | {name: .name, size: .size}]}'

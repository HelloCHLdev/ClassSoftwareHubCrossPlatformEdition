# ─────────────────────────────────────────────────────────────
#  ClassSoftwareHub 跨平台版 —— 构建流水线
#
#  目标平台 / 产物：
#    windows-x64  → ClassSoftwareHub-Setup-dv<ver>-win-x64.exe（单文件自包含）
#                   + ClassSoftwareHub-dv<ver>-win-x64.zip
#    macos-arm64  → ClassSoftwareHub.app（zip）
#    macos-x64    → ClassSoftwareHub.app（zip）
#    linux-arm64  → classsoftwarehub_<ver>_arm64.deb
#    linux-x64    → classsoftwarehub_<ver>_amd64.deb
#
#  这个文件既是「构建流水线」也是「发版流水线」：
#  构建矩阵全部成功后自动发一个 GitHub Release，
#  发布说明直接取仓库里的 CHANGELOG.md，不用再手写一遍。
#
#  触发方式：
#    · push 到任意分支       → 构建 + 发一个 v0.0.0-ci.<sha> 的预发布 Release
#    · push v* tag           → 构建 + 发该 tag 的正式 Release
#    · pull_request         → 只构建，不发（fork 不能往仓库塞 Release）
#    · 手动 dispatch         → 同上，输入框里可以关掉发布
#    · 被别的 workflow 调用  → 构建并把版本号输出给调用方
# ─────────────────────────────────────────────────────────────
name: Build

on:
  push:
    branches:
      - '**'
    # 注意：push.branches 不匹配 tag，必须单独写 tags，否则推 tag 不会触发构建
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空：tag 用 tag 名，否则用 0.0.0-ci.<sha 前 7 位>）'
        required: false
        type: string
        default: ''
      publish:
        description: '构建完成后是否发布 Release'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: '版本号（留空：tag 用 tag 名，否则用 0.0.0-ci.<sha 前 7 位>）'
        required: false
        type: string
        default: ''
      publish:
        description: '构建完成后是否发布 Release'
        required: false
        type: boolean
        default: true
    outputs:
      version:
        description: '本次实际使用的版本号'
        value: ${{ jobs.build.outputs.version }}

#  默认只读；写 Release 的权限只给 release job（job 级权限会覆盖这里的默认值）
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # 每次推送都会发一个 Release，中途取消可能留下一个资产不全的 Release，
  # 所以这里排队跑，不取消。
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    strategy:
      # 一个平台挂掉不影响其它平台
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            rid: win-x64
            pkg: windows
          # Apple Silicon：macos-15 是 arm64 机器
          - target: macos-arm64
            os: macos-15
            rid: osx-arm64
            pkg: macos
          # Intel：macos-13 已于 2025-12 下线，Intel 机器现在用 macos-15-intel
          - target: macos-x64
            os: macos-15-intel
            rid: osx-x64
            pkg: macos
          # ARM64 Linux runner：公开仓库免费；私有仓库需要 Team/Enterprise 套餐
          - target: linux-arm64
            os: ubuntu-24.04-arm
            rid: linux-arm64
            pkg: linux
            deb_arch: arm64
          - target: linux-x64
            os: ubuntu-24.04
            rid: linux-x64
            pkg: linux
            deb_arch: amd64

    env:
      PROJECT: ClassSoftwareHubCrossPlatformEdition
      APP_NAME: ClassSoftwareHub
      # 可选：仓库变量 DEBIAN_MAINTAINER 用来改 deb 里的维护者信息
      # （不填就用默认的 ClassSoftwareHub <noreply@github.com>）
      DEBIAN_MAINTAINER: ${{ vars.DEBIAN_MAINTAINER }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 清掉仓库里误提交的 bin/obj
        shell: bash
        run: rm -rf "${PROJECT}/obj" "${PROJECT}/bin"

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.rid }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ matrix.rid }}-
            nuget-

      - name: 计算版本号
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ inputs.version }}"
          if [ -z "${ver}" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              ver="${GITHUB_REF_NAME#v}"
            else
              ver="0.0.0-ci.${GITHUB_SHA:0:7}"
            fi
          fi
          ver="${ver#v}"

          # AssemblyVersion / FileVersion 只能是纯数字四段，
          # CI 版本带预发布后缀（0.0.0-ci.xxxxxxx）时单独取数字部分。
          core="${ver%%-*}"
          nums="$(printf '%s' "${core}" | sed 's/[^0-9.]//g')"
          IFS='.' read -r a b c d <<< "${nums}"
          asmver="${a:-0}.${b:-0}.${c:-0}.${d:-0}"

          echo "version=${ver}" >> "${GITHUB_OUTPUT}"
          echo "asmver=${asmver}" >> "${GITHUB_OUTPUT}"
          echo "版本：${ver}（程序集版本 ${asmver}）"

      - name: 发布（dotnet publish）
        shell: bash
        run: |
          set -euo pipefail
          # 单文件自包含：一个可执行文件里塞进 .NET 运行时 + Avalonia 原生库。
          #  · IncludeNativeLibrariesForSelfExtract：macOS/Linux 上原生库默认不打包，
          #    打开它才会连 .so/.dylib 一起塞进单文件（运行时再解到临时目录）。
          #  · PublishTrimmed 保持 false：SettingsStore / SubmitPage 用了反射式
          #    JsonSerializer，裁剪会直接把 AppSettings 这类类型裁掉。
          dotnet publish "${PROJECT}/${PROJECT}.csproj" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            --nologo \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishTrimmed=false \
            -p:DebugType=none \
            -p:Version="${{ steps.ver.outputs.version }}" \
            -p:AssemblyVersion="${{ steps.ver.outputs.asmver }}" \
            -p:FileVersion="${{ steps.ver.outputs.asmver }}" \
            -o publish

          echo "──── 发布产物 ────"
          ls -lh publish

      # ── Windows x64 ───────────────────────────────────────────
      - name: 打包（Windows x64）
        if: matrix.pkg == 'windows'
        shell: pwsh
        run: |
          ${ErrorActionPreference} = 'Stop'
          ${ver}  = '${{ steps.ver.outputs.version }}'
          ${name} = '${{ env.APP_NAME }}'
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null

          # 单文件自包含 → publish 目录里就一个自带运行时的 exe
          Copy-Item 'publish/ClassSoftwareHubCrossPlatformEdition.exe' "dist/${name}-Setup-dv${ver}-win-x64.exe"

          # 再打一个 zip，给不想直接运行 exe 的用户
          Compress-Archive -Path 'publish/*' -DestinationPath "dist/${name}-dv${ver}-win-x64.zip"

          Get-ChildItem dist | Format-Table Name, Length

      # ── macOS（arm64 / x64）───────────────────────────────────
      - name: 打包（macOS .app）
        if: matrix.pkg == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          NAME="ClassSoftwareHub"
          VER="${{ steps.ver.outputs.version }}"
          ASMVER="${{ steps.ver.outputs.asmver }}"
          ARCH="${{ matrix.target }}"          # macos-arm64 / macos-x64
          BUNDLE="${NAME}.app"
          DIST="dist"
          mkdir -p "${DIST}"

          rm -rf "${BUNDLE}"
          mkdir -p "${BUNDLE}/Contents/MacOS" "${BUNDLE}/Contents/Resources"

          # 1) 主程序：单文件自包含的 Mach-O 可执行文件
          install -m 0755 "publish/ClassSoftwareHubCrossPlatformEdition" "${BUNDLE}/Contents/MacOS/${NAME}"

          # 2) 图标：512 PNG → iconset → icns（iconutil 要求这一整套文件名）
          SRC="${PROJECT}/Assets/AppIcon-512.png"
          SET="${RUNNER_TEMP}/AppIcon.iconset"
          rm -rf "${SET}"
          mkdir -p "${SET}"
          sips -z 16 16     "${SRC}" --out "${SET}/icon_16x16.png"      >/dev/null
          sips -z 32 32     "${SRC}" --out "${SET}/icon_16x16@2x.png"    >/dev/null
          sips -z 32 32     "${SRC}" --out "${SET}/icon_32x32.png"      >/dev/null
          sips -z 64 64     "${SRC}" --out "${SET}/icon_32x32@2x.png"    >/dev/null
          sips -z 128 128   "${SRC}" --out "${SET}/icon_128x128.png"     >/dev/null
          sips -z 256 256   "${SRC}" --out "${SET}/icon_128x128@2x.png"  >/dev/null
          sips -z 256 256   "${SRC}" --out "${SET}/icon_256x256.png"     >/dev/null
          sips -z 512 512   "${SRC}" --out "${SET}/icon_256x256@2x.png"  >/dev/null
          sips -z 512 512   "${SRC}" --out "${SET}/icon_512x512.png"     >/dev/null
          sips -z 1024 1024 "${SRC}" --out "${SET}/icon_512x512@2x.png"  >/dev/null
          iconutil -c icns "${SET}" -o "${BUNDLE}/Contents/Resources/AppIcon.icns"

          # 3) Info.plist
          #    CFBundleVersion / ShortVersionString 只接受 X.Y.Z，用数字版号；
          #    带后缀的完整版本号放自定义键里。
          cat > "${BUNDLE}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>${NAME}</string>
              <key>CFBundleDisplayName</key>
              <string>${NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>cn.classsoftwarehub.crossplatform</string>
              <key>CFBundleExecutable</key>
              <string>${NAME}</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleShortVersionString</key>
              <string>${ASMVER}</string>
              <key>CFBundleVersion</key>
              <string>${ASMVER}</string>
              <key>CFBundleVersionLabel</key>
              <string>dv${VER}</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.utilities</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST
          printf 'APPL????' > "${BUNDLE}/Contents/PkgInfo"

          # 4) 签名：.NET 单文件程序把 bundle 追加在 Mach-O 尾部，
          #    codesign 会重写签名并挪动文件末尾 → 把 bundle 偏移量写坏，
          #    所以这里**不**签名，改在 Release 说明里告诉用户怎么绕过 Gatekeeper。
          #    将来有开发者证书时，正确做法是先 codesign 整个 .app 再公证。

          # 5) 打包成 zip（ditto 能保住 .app 的目录结构、符号链接和执行权限）
          #    --norsrc：不把资源叉/扩展属性塞成 __MACOSX/._xxx 垃圾条目
          xattr -cr "${BUNDLE}" 2>/dev/null || true
          ditto -c -k --norsrc --keepParent "${BUNDLE}" "${DIST}/${NAME}-dv${VER}-${ARCH}.zip"

          # 6) 可选：顺便出个 dmg（想要挂到 Release 上就把下面这行放开）
          # hdiutil create -volname "${NAME}" -srcfolder "${BUNDLE}" -ov -format UDZO "${DIST}/${NAME}-dv${VER}-${ARCH}.dmg"

          ls -lh "${DIST}"

      # ── Linux（deb，arm64 / x64）──────────────────────────────
      - name: 打包（Linux deb）
        if: matrix.pkg == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          NAME="ClassSoftwareHub"
          PKG="classsoftwarehub"
          VER="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.deb_arch }}"
          # Debian 的版本号里不能直接带 '-'，预发布后缀按惯例换成 '~'。
          # ⚠️ 千万不要用 ${VER//-/~}：bash 5.x（Ubuntu runner）会把替换串里的 ~ 当成
          #    家目录展开成 /home/runner，版本号会变成 0.0.0/home/runnerci.xxxxx，
          #    dpkg-deb 直接报 "invalid character in version number"。
          #    bash 3.2（macOS）不展开，所以本地根本测不出来 —— 用 tr 最保险。
          DEB_VER="$(printf '%s' "${VER}" | tr '-' '~')"
          # Debian 版本号必须以数字开头
          case "${DEB_VER}" in
            [0-9]*) ;;
            *) DEB_VER="0.0.0~${DEB_VER}" ;;
          esac
          ROOT="deb-root"
          DIST="dist"

          rm -rf "${ROOT}" "${DIST}"
          mkdir -p "${ROOT}/DEBIAN" \
                   "${ROOT}/opt/${PKG}" \
                   "${ROOT}/usr/bin" \
                   "${ROOT}/usr/share/applications" \
                   "${ROOT}/usr/share/icons/hicolor/512x512/apps" \
                   "${ROOT}/usr/share/doc/${PKG}" \
                   "${DIST}"

          # 1) 主程序装到 /opt/<pkg>/，再软链到 /usr/bin
          install -m 0755 "publish/ClassSoftwareHubCrossPlatformEdition" "${ROOT}/opt/${PKG}/${NAME}"
          ln -s "/opt/${PKG}/${NAME}" "${ROOT}/usr/bin/${PKG}"

          # 2) 图标（hicolor 约定，用户换主题也能拿到）
          install -m 0644 "${PROJECT}/Assets/AppIcon-512.png" "${ROOT}/usr/share/icons/hicolor/512x512/apps/${PKG}.png"

          # 3) 桌面项
          cat > "${ROOT}/usr/share/applications/${PKG}.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=${NAME}
          Comment=Class Software Hub 跨平台版
          Exec=${PKG}
          Icon=${PKG}
          Terminal=false
          Categories=Utility;
          StartupWMClass=${NAME}
          DESKTOP

          # 4) 说明文档
          cat > "${ROOT}/usr/share/doc/${PKG}/README.md" <<DOC
          # ${NAME}

          Class Software Hub 的跨平台桌面版（Avalonia ${VER}）。

          安装后可以从应用菜单启动，也可以在终端里直接运行：

              ${PKG}

          数据目录遵循 XDG 约定：~/.local/share/ClassSoftwareHub
          （可用环境变量 CSH_DATA_DIR 覆盖）。
          DOC

          # 5) control
          #    ICU 用 | 列出多个可选版本，避免在 22.04 / 24.04 / Debian 上装不上；
          #    libstdc++6 是 SkiaSharp 原生库需要的。
          INSTALLED_SIZE="$(du -sk "${ROOT}" | cut -f1)"
          MAINTAINER="${DEBIAN_MAINTAINER:-ClassSoftwareHub <noreply@github.com>}"
          cat > "${ROOT}/DEBIAN/control" <<CONTROL
          Package: ${PKG}
          Version: ${DEB_VER}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: ${MAINTAINER}
          Installed-Size: ${INSTALLED_SIZE}
          Depends: libc6, libstdc++6, libicu74 | libicu76 | libicu72 | libicu70, libssl3, libfontconfig1, libfreetype6, libgl1, libdbus-1-3, libice6, libsm6, libx11-6, libxext6, libxfixes3, libxi6, libxrandr2, libxrender1, libxcursor1, zlib1g
          Description: Class Software Hub 跨平台桌面版
           Avalonia 移植版，支持 Windows / macOS / Linux 桌面。
          CONTROL

          # 6) 打包
          echo "──── DEBIAN/control ────"
          cat "${ROOT}/DEBIAN/control"
          dpkg-deb --build --root-owner-group "${ROOT}" "${DIST}/${PKG}_${DEB_VER}_${ARCH}.deb"
          dpkg-deb --info "${DIST}/${PKG}_${DEB_VER}_${ARCH}.deb"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  #  构建矩阵全部成功后，把产物汇总成 GitHub Release
  #
  #  发布规则：
  #    · push 任意分支          → 发一个 v0.0.0-ci.<sha> 的预发布 Release
  #    · push v* tag            → 发该 tag 的正式 Release
  #    · 手动 dispatch          → 同上（可在输入里关掉）
  #    · pull_request          → 不发（fork 的 PR 不能往仓库里塞 Release）
  #
  #  发布说明取仓库里的 CHANGELOG.md；没有或为空时自动生成摘要兜底。
  #
  #  tag 用真实版本号而不是「latest」这种滚动 tag：应用内更新器
  #  （Services/Updating/UpdateModels.cs 的 VersionCompare）会把 tag 当版本号比大小，
  #  滚动 tag 会被判成比正式版还新，用户就会收到假更新。
  # ────────────────────────────────────────────────────────────
  release:
    name: 发布 Release
    needs: build
    if: >-
      success() &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: 检出代码（取 CHANGELOG）
        uses: actions/checkout@v7

      - name: 下载全部构建产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 准备发布说明
        run: |
          set -euo pipefail
          NOTES=""
          for f in CHANGELOG.md CHANGELOG.MD docs/CHANGELOG.md \
                   ClassSoftwareHubCrossPlatformEdition/CHANGELOG.md \
                   ClassSoftwareHubCrossPlatformEdition/CHANGELOG.MD; do
            if [ -s "${f}" ]; then
              NOTES="${f}"
              break
            fi
          done
          if [ -n "${NOTES}" ]; then
            echo "发布说明取自 ${NOTES}"
            cp "${NOTES}" release-notes.md
          else
            echo "⚠️ 仓库里没有非空的 CHANGELOG，改用自动生成的摘要"
            {
              echo "## ClassSoftwareHub v${VERSION}"
              echo
              echo "（仓库里没有 CHANGELOG.md，以下是自动生成的摘要）"
              echo
              echo "### 安装包"
              for p in dist/*.exe dist/*.zip dist/*.deb; do
                [ -e "${p}" ] || continue
                pname="$(basename "${p}")"
                psize="$(du -h "${p}" | cut -f1)"
                printf -- '- `%s`（%s）\n' "${pname}" "${psize}"
              done
              echo
              echo "### 校验"
              echo
              echo '每个包的 MD5 在 `checksums.md5` 里（md5sum 格式），本地可以这样对：'
              echo
              echo '```sh'
              echo 'md5sum -c checksums.md5'
              echo '```'
              echo
              echo "### macOS 第一次打开"
              echo
              echo '这个包没有签名和公证，第一次打开会被 Gatekeeper 拦。两个办法：'
              echo
              echo '1. 右键点应用 →「打开」→ 再点「打开」；'
              echo '2. 或者在终端里先去掉隔离标记：'
              echo
              echo '```sh'
              echo 'xattr -dr com.apple.quarantine ClassSoftwareHub.app'
              echo '```'
              echo
              echo "### Linux"
              echo
              echo '```sh'
              echo 'sudo apt install ./classsoftwarehub_*.deb'
              echo '```'
            } > release-notes.md
          fi
          echo "──── release-notes.md ────"
          cat release-notes.md

      - name: 规整资产文件名
        run: |
          set -euo pipefail
          # GitHub 上传 Release 资产时会把文件名里的 '~' 换成 '.'（实测过）。
          # Debian 的预发布版本号要用 ~ 才能保证 beta 排在正式版前面，但直接上传的话
          # 资产名会被改掉，checksums.md5 里的名字就和资产对不上，md5sum -c 会失败。
          # 所以上传前自己先换掉，GitHub 就不会再动它。
          for f in dist/*; do
            case "${f}" in
              *'~'*)
                newf="$(printf '%s' "${f}" | tr '~' '.')"
                mv -- "${f}" "${newf}"
                echo "改名：${f} -> ${newf}"
                ;;
            esac
          done
          ls -l dist/

      - name: 生成校验和
        run: |
          set -euo pipefail
          cd dist
          rm -f checksums.md5
          md5sum -b * > checksums.md5
          cat checksums.md5

      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_TAG_PUSH: ${{ github.ref_type == 'tag' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${IS_TAG_PUSH}" = "true" ]; then
            TAG="${REF_NAME}"
            EXTRA="--verify-tag"
          else
            TAG="v${VERSION}"
            EXTRA="--target ${GITHUB_SHA}"
          fi
          TITLE="ClassSoftwareHub v${VERSION}"
          PRE=""
          case "${VERSION}" in
            *-*) PRE="--prerelease" ;;
          esac
          echo "Release tag：${TAG}"
          echo "─────────────────────"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release 已存在，覆盖上传资产"
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md
          else
            echo "创建 Release"
            # shellcheck disable=SC2086
            gh release create "${TAG}" dist/* \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              ${EXTRA} ${PRE}
          fi
          echo "──── Release 资产 ────"
          gh release view "${TAG}" --json name,tagName,url,assets \
            --jq '{tag: .tagName, name: .name, url: .url, assets: [.assets[] | {name: .name, size: .size}]}'
